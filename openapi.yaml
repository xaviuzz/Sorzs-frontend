openapi: 3.0.3
info:
  title: Sorzs API
  version: 0.1.0
paths:
  /health.check:
    post:
      operationId: healthCheck
      summary: Tells whether the service is alive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthCheckCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /sources.add:
    post:
      operationId: sourcesAdd
      summary: Adds a source to the user's list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcesAddCall"
      responses:
        "200":
          description: the created entry, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesAddReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /sources.inspect:
    post:
      operationId: sourcesInspect
      summary: Reads the title and favicon a page offers, registering nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcesInspectCall"
      responses:
        "200":
          description: the title and favicon, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesInspectReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /sources.list:
    post:
      operationId: sourcesList
      summary: Lists the user's sources in order of addition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcesListCall"
      responses:
        "200":
          description: the entries, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesListReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
components:
  schemas:
    CallHeader:
      type: object
      required: [callId]
      properties:
        callId:
          type: string
          minLength: 1
    HealthCheckCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    ReplyHeader:
      type: object
      required: [callId, status]
      properties:
        callId:
          type: string
        status:
          type: string
          enum: [ok, error]
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_BODY
            - SOURCE_ALREADY_REGISTERED
            - SOURCE_NAME_TAKEN
            - INTERNAL_ERROR
        message:
          type: string
    HealthCheckReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]
            - $ref: "#/components/schemas/ErrorBody"
    SourceEntry:
      type: object
      required: [sourceId, name, address, title, favicon]
      properties:
        sourceId:
          type: string
        name:
          type: string
          nullable: true
        address:
          type: string
        title:
          type: string
          nullable: true
        favicon:
          type: string
          nullable: true
    SourcesAddCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [address]
          properties:
            address:
              type: string
            name:
              type: string
    SourcesAddReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SourceEntry"
            - $ref: "#/components/schemas/ErrorBody"
    SourcesInspectCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [address]
          properties:
            address:
              type: string
    SourcesInspectReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [title, favicon]
              properties:
                title:
                  type: string
                  nullable: true
                favicon:
                  type: string
                  nullable: true
            - $ref: "#/components/schemas/ErrorBody"
    SourcesListCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    SourcesListReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [sources]
              properties:
                sources:
                  type: array
                  items:
                    $ref: "#/components/schemas/SourceEntry"
            - $ref: "#/components/schemas/ErrorBody"
    TransportError:
      $ref: "#/components/schemas/ErrorBody"
