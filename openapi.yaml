openapi: 3.0.3
info:
  title: Sorzs API
  version: 0.1.0
paths:
  /health.check:
    post:
      operationId: healthCheck
      summary: Tells whether the service is alive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallWithoutBody"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckReply"
        "400":
          $ref: "#/components/responses/TransportError"
  /auth.login:
    post:
      operationId: authLogin
      summary: Exchanges a username and password for a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginCall"
      responses:
        "200":
          description: the token, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginReply"
        "400":
          $ref: "#/components/responses/TransportError"
  /sorzs.add:
    post:
      operationId: sorzsAdd
      summary: Adds a sorz to the user's list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SorzsAddCall"
      responses:
        "200":
          description: the created entry, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorzsAddReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sorzs.inspect:
    post:
      operationId: sorzsInspect
      summary: Reads the title and favicon a page offers, registering nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SorzsInspectCall"
      responses:
        "200":
          description: the title and favicon, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorzsInspectReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sorzs.list:
    post:
      operationId: sorzsList
      summary: Lists the user's sorzs in order of addition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallWithoutBody"
      responses:
        "200":
          description: the entries, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorzsListReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sorzs.search:
    post:
      operationId: sorzsSearch
      summary: Searches a term across the user's sorzs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SorzsSearchCall"
      responses:
        "200":
          description: one result per sorz in list order, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorzsSearchReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users.list:
    post:
      operationId: usersList
      summary: Lists every user with their role, for an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallWithoutBody"
      responses:
        "200":
          description: the users, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersListReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users.add:
    post:
      operationId: usersAdd
      summary: Adds a user with a password and a role, for an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsersAddCall"
      responses:
        "200":
          description: the created user, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersAddReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users.setRole:
    post:
      operationId: usersSetRole
      summary: Changes the role of a user, for an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsersSetRoleCall"
      responses:
        "200":
          description: the user with the new role, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersSetRoleReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sorzs.census:
    post:
      operationId: sorzsCensus
      summary: Lists every sorz held by at least one user's list, with how many users hold it, for an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallWithoutBody"
      responses:
        "200":
          description: the sorzs ordered by address, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SorzsCensusReply"
        "400":
          $ref: "#/components/responses/TransportError"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    TransportError:
      description: unreadable JSON or missing callId
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: missing, malformed or altered token, or a user who is not an admin on an admin operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    CallHeader:
      type: object
      required: [callId]
      properties:
        callId:
          type: string
          minLength: 1
    CallWithoutBody:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    ReplyHeader:
      type: object
      required: [callId, status]
      properties:
        callId:
          type: string
        status:
          type: string
          enum: [ok, error]
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_BODY
            - INVALID_CREDENTIALS
            - FORBIDDEN
            - SORZ_ALREADY_REGISTERED
            - SORZ_NAME_TAKEN
            - USERNAME_TAKEN
            - LAST_ADMIN
            - INTERNAL_ERROR
        message:
          type: string
    HealthCheckBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    HealthCheckReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/HealthCheckBody"
            - $ref: "#/components/schemas/ErrorBody"
    AuthLoginCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [username, password]
          properties:
            username:
              type: string
            password:
              type: string
    AuthLoginBody:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
          enum: [admin, user]
    AuthLoginReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/AuthLoginBody"
            - $ref: "#/components/schemas/ErrorBody"
    SearchProviderId:
      type: string
      enum: [reddit, generic]
    SorzEntry:
      type: object
      required: [sorzId, name, address, title, favicon, provider]
      properties:
        sorzId:
          type: string
        name:
          type: string
          nullable: true
        address:
          type: string
        title:
          type: string
          nullable: true
        favicon:
          type: string
          nullable: true
        provider:
          $ref: "#/components/schemas/SearchProviderId"
    SorzsAddCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [address]
          properties:
            address:
              type: string
            name:
              type: string
    SorzsAddReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SorzEntry"
            - $ref: "#/components/schemas/ErrorBody"
    SorzsInspectCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [address]
          properties:
            address:
              type: string
    InspectCandidate:
      type: object
      required: [address, title, favicon]
      properties:
        address:
          type: string
        title:
          type: string
        favicon:
          type: string
          nullable: true
    SorzsInspectBody:
      type: object
      required: [title, favicon, candidates]
      properties:
        title:
          type: string
          nullable: true
        favicon:
          type: string
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/InspectCandidate"
    SorzsInspectReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SorzsInspectBody"
            - $ref: "#/components/schemas/ErrorBody"
    SorzsListBody:
      type: object
      required: [sorzs]
      properties:
        sorzs:
          type: array
          items:
            $ref: "#/components/schemas/SorzEntry"
    SorzsListReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SorzsListBody"
            - $ref: "#/components/schemas/ErrorBody"
    SorzsSearchCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [query]
          properties:
            query:
              type: string
    SearchResult:
      type: object
      required: [title, url, description, sorz]
      properties:
        title:
          type: string
        url:
          type: string
        description:
          type: string
        sorz:
          type: string
    SorzsSearchBody:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SorzsSearchReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SorzsSearchBody"
            - $ref: "#/components/schemas/ErrorBody"
    CensusEntry:
      type: object
      required: [address, favicon, provider, users]
      properties:
        address:
          type: string
        favicon:
          type: string
          nullable: true
        provider:
          $ref: "#/components/schemas/SearchProviderId"
        users:
          type: integer
    SorzsCensusBody:
      type: object
      required: [sorzs]
      properties:
        sorzs:
          type: array
          items:
            $ref: "#/components/schemas/CensusEntry"
    SorzsCensusReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/SorzsCensusBody"
            - $ref: "#/components/schemas/ErrorBody"
    UserEntry:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
    UsersListBody:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserEntry"
    UsersListReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/UsersListBody"
            - $ref: "#/components/schemas/ErrorBody"
    UsersAddCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [username, password, role]
          properties:
            username:
              type: string
            password:
              type: string
            role:
              type: string
              enum: [admin, user]
    UsersAddReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/UserEntry"
            - $ref: "#/components/schemas/ErrorBody"
    UsersSetRoleCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [username, role]
          properties:
            username:
              type: string
            role:
              type: string
              enum: [admin, user]
    UsersSetRoleReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - $ref: "#/components/schemas/UserEntry"
            - $ref: "#/components/schemas/ErrorBody"
